---
# Per environment values which override defaults in hmpps-probation-supervision-early-termination-ui/values.yaml

generic-service:
  replicaCount: 2

  ingress:
    host: probation-supervision-early-termination-ui-preprod.hmpps.service.justice.gov.uk

  env:
    INGRESS_URL: "https://probation-supervision-early-termination-ui-preprod.hmpps.service.justice.gov.uk"
    HMPPS_AUTH_URL: "https://sign-in-preprod.hmpps.service.justice.gov.uk/auth"
    TOKEN_VERIFICATION_API_URL: "https://token-verification-api-preprod.prison.service.justice.gov.uk"
    EXAMPLE_API_URL: 'https://template-kotlin-preprod.hmpps.service.justice.gov.uk'
    ENVIRONMENT_NAME: PRE-PRODUCTION
    PROBATION_FRONTEND_COMPONENTS_API_URL: 'https://probation-frontend-components-preprod.hmpps.service.justice.gov.uk'
    PROBATION_FRONTEND_COMPONENTS_CONNECT_SRC: 'https://probation-frontend-components-preprod.hmpps.service.justice.gov.uk'
    PROBATION_FRONTEND_COMPONENTS_FONT_SRC: 'https://probation-frontend-components-preprod.hmpps.service.justice.gov.uk'
    MANAGE_PEOPLE_ON_PROBATION_URL: 'https://manage-people-on-probation-preprod.hmpps.service.justice.gov.uk'
    DELIUS_LINK: 'https://ndelius.pre-prod.delius.probation.hmpps.dsd.io'
    FLIPT_URL: 'https://feature-flags-manage-people-on-probation-preprod.hmpps.service.justice.gov.uk'

  allowlist:
    # Configure groups as appropriate to give the minimum ingress access required:
    #   digital_staff_and_mojo: devices on the MoJ network
    #   moj_cloud_platform: services on Cloud Platform
    # Other IP allowlist groups are here:
    # https://github.com/ministryofjustice/hmpps-ip-allowlists/blob/main/ip-allowlist-groups.yaml

    groups:
      - digital_staff_and_mojo
      - moj_cloud_platform

  # NOTE: Removing ALL allowlist groups will make the application accessible from the internet.
  #       If you are intending to do this, please ensure you uncomment the 'modsecurity_enabled=true'
  #       entry in the ingress above. This will enable WAF protection of the endpoint. You will need
  #       to configure modsecurity rules to suit your needs. Further information can be found here:
  #       https://user-guide.cloud-platform.service.justice.gov.uk/documentation/networking/modsecurity.html#modsecurity-web-application-firewall




generic-prometheus-alerts:
  alertSeverity: manage-people-on-probation-alerts-nonprod
