generic-service:
  nameOverride: hmpps-probation-supervision-early-termination-ui
  productId: 'HMPPS541' # productId for the product that this belongs too, i.e. DPS001, see README.md for details

  # the IRSA service account name for accessing AWS resources (e.g: audit SQS queue)
  # serviceAccountName: "hmpps-probation-supervision-early-termination-ui"

  replicaCount: 4

  image:
    repository: ghcr.io/ministryofjustice/hmpps-probation-supervision-early-termination-ui
    tag: app_version # override at deployment time
    port: 3000

  ingress:
    enabled: true
    host: app-hostname.local # override per environment
    tlsSecretName: hmpps-probation-supervision-early-termination-ui-cert

  livenessProbe:
    httpGet:
      path: /ping

  readinessProbe:
    httpGet:
      path: /ping

  # Environment variables to load into the deployment
  env:
    NODE_ENV: 'production'
    LOG_LEVEL: 'info'
    REDIS_ENABLED: 'true'
    REDIS_TLS_ENABLED: 'true'
    TOKEN_VERIFICATION_ENABLED: 'true'
    AUDIT_ENABLED: 'false'
    AUDIT_SERVICE_NAME: 'hmpps-probation-supervision-early-termination-ui' # Your audit service name

  # Pre-existing kubernetes secrets to load as environment variables in the deployment.
  # namespace_secrets:
  #   [name of kubernetes secret]:
  #     [name of environment variable as seen by app]: [key of kubernetes secret to load]

  namespace_secrets:
    # These secrets are created by terraform.
    hmpps-probation-supervision-early-termination-ui-client-creds:
      CLIENT_CREDS_CLIENT_ID: 'CLIENT_CREDS_CLIENT_ID'
      CLIENT_CREDS_CLIENT_SECRET: 'CLIENT_CREDS_CLIENT_SECRET'
    hmpps-probation-supervision-early-termination-ui-auth-code:
      AUTH_CODE_CLIENT_ID: 'AUTH_CODE_CLIENT_ID'
      AUTH_CODE_CLIENT_SECRET: 'AUTH_CODE_CLIENT_SECRET'
    hmpps-probation-supervision-early-termination-ui-session-secret:
      SESSION_SECRET: 'SESSION_SECRET'
    hmpps-probation-supervision-early-termination-ui-elasticache-redis:
      REDIS_HOST: 'primary_endpoint_address'
      REDIS_AUTH_TOKEN: 'auth_token'
    hmpps-probation-supervision-early-termination-ui-application-insights:
      APPLICATIONINSIGHTS_CONNECTION_STRING: "APPLICATIONINSIGHTS_CONNECTION_STRING"
    # This secret will need to be created in your namespace if you add audit integration
    # IRSA configuration in your namespace will also be required.
    # sqs-hmpps-audit-secret:
    #  AUDIT_SQS_QUEUE_URL: "sqs_queue_url"
    #  AUDIT_SQS_QUEUE_NAME: "sqs_queue_name"

generic-prometheus-alerts:
  targetApplication: hmpps-probation-supervision-early-termination-ui
